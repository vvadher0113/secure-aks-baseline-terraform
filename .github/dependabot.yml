version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: UTC
    commit-message:
      prefix: "ci"
    labels:
      - dependencies
      - github-actions

  - package-ecosystem: terraform
    directory: /infra/platform
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: UTC
    commit-message:
      prefix: "deps"
    labels:
      - dependencies
      - terraform

  - package-ecosystem: terraform
    directory: /infra/cluster-config
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: UTC
    commit-message:
      prefix: "deps"
    labels:
      - dependencies
      - terraform

  - package-ecosystem: terraform
    directory: /bootstrap
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: UTC
    commit-message:
      prefix: "deps"
    labels:
      - dependencies
      - terraform
