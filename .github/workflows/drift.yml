name: Drift Detection

on:
  schedule:
    # Runs every night at 02:00 UTC
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read
  issues: write

env:
  TF_VERSION: "1.11.0"
  ARM_USE_OIDC: "true"
  ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
  ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}

jobs:
  drift:
    name: Detect Drift
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/platform

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5 # v2.3.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: terraform init
        run: terraform init -backend-config=../../backends/platform.hcl

      - name: terraform plan (drift check)
        id: plan
        run: |
          set +e
          terraform plan \
            -var-file=terraform.tfvars \
            -detailed-exitcode \
            -no-color \
            2>&1 | tee drift_output.txt
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"

      - name: Open GitHub issue on drift
        if: steps.plan.outputs.exit_code == '2'
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            const fs = require('fs');
            const output = fs.readFileSync('infra/platform/drift_output.txt', 'utf8');
            const truncated = output.length > 60000
              ? output.substring(0, 60000) + '\n\n... (truncated)'
              : output;
            const title = `[Drift Detected] ${new Date().toISOString().split('T')[0]}`;
            const body = [
              '## Infrastructure Drift Detected',
              '',
              'The nightly drift check found differences between the Terraform state and the deployed infrastructure.',
              'Review the plan output below and apply or reconcile as appropriate.',
              '',
              '<details><summary>Plan Output</summary>',
              '',
              '```',
              truncated,
              '```',
              '',
              '</details>',
            ].join('\n');
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ['drift', 'infrastructure'],
            });

      - name: Fail on drift
        if: steps.plan.outputs.exit_code == '2'
        run: |
          echo "Drift detected. See the opened GitHub issue for details."
          exit 1

      - name: No drift
        if: steps.plan.outputs.exit_code == '0'
        run: echo "No drift detected. Infrastructure matches state."
