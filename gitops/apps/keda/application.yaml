apiVersion: v1
kind: Namespace
metadata:
  name: keda-demo
  labels:
    app.kubernetes.io/managed-by: argocd
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keda-consumer
  namespace: keda-demo
  labels:
    app: keda-consumer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: keda-consumer
  template:
    metadata:
      labels:
        app: keda-consumer
    spec:
      nodeSelector:
        nodepool-type: user
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: consumer
          image: mcr.microsoft.com/azuredocs/aks-helloworld:v1
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
